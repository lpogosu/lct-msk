# Content-Security-Policy для интерфейса (статика): всё своё, внешних скриптов, шрифтов и стилей нет (шрифты и 3D — в /fonts, /3d).
# 'unsafe-inline' только для style: React/Tailwind задают встроенные стили (width, цвета графиков); скрипты — только 'self'.
# Не подключается в location /api/: Swagger UI бэкенда использует встроенные скрипты. Проверено e2e-набором на сборке с этой политикой.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
