# Параметры «Антиподсказчика»: двойник в буфере, улики, акт сверки, «Подтверждение за 5 минут», песочница жюри.
# Источник: _internal/design/spec-antiassist.md §2.1, §3, §7; killer-features.md §2.1 (1–3), §3.
# ВСЕ пороги и тексты — здесь; в коде app/testing/anticheat/ магических чисел нет.
# ε (вероятность честно попасть на ключ двойника) НЕ измерена на людях: значения консервативные, вес в доверии 0.
version: 1

# ----------------------------------------------------------------------------- генерация двойников
twins:
  version: "twin-v1"
  supported_formats: [predict_output, sql_result]   # остальные форматы — вне MVP (spec §2.1, каталог мутаций)
  classes_mvp: [data_literal, table_value]
  eligible_languages: [python, javascript, sql]     # только то, что исполняют run_python / run_js / run_sql
  max_literals: 14                # сколько литералов перебирать на экземпляр
  max_values_per_literal: 3       # сколько новых значений пробовать для литерала
  max_attempts: 24                # общий потолок исполнений на экземпляр
  max_values_per_literal_sql: 6   # SQL исполняется в памяти за доли миллисекунды: перебор шире
  max_attempts_sql: 60
  min_value: 2                    # 0 и 1 — служебные значения (счётчики, инкременты), их не трогаем
  max_value: 1000000000
  max_length_delta: 1             # новый токен длиннее/короче не более чем на 1 символ
  max_key_decimals: 4             # ключ двойника с более длинной дробью (9586.666…) бот не воспроизведёт буквально: отклоняем
  rel_change: { min: 0.12, max: 0.8 }   # относительное изменение значения (не «±1»: это похоже на ошибку на единицу)
  exec_timeout_s: 4.0
  # гейт 6: пары, которые нельзя подставлять друг вместо друга (мелкий шрифт на телефоне)
  confusable_pairs: ["17", "38", "56", "08", "09", "89", "l1", "O0", "I1", "Il", "B8", "S5"]
  # вызовы, аргументы которых — границы/индексы/задержки, а не данные
  excluded_callees: [range, slice, splice, substring, substr, at, charAt, charCodeAt, repeat, padStart, padEnd,
                     toFixed, toPrecision, round, setTimeout, setInterval, sleep, Array, parseInt, int, divmod,
                     islice, enumerate, min, max, clamp, pow]
  compare_ops: ["<", ">", "<=", ">=", "==", "!=", "===", "!=="]
  structural_ops: ["%", "//", "<<", ">>", ">>>", "&", "|", "^", "**"]
  # приоритет по роли литерала: меньше — предпочтительнее (элементы данных, множители — до аргументов и «прочих»)
  role_tier:
    element: 1
    value: 1
    multiplier: 1
    assign: 2
    kwarg: 2
    arg: 2
    arith: 2
    default: 3
    other: 3
    string_digits: 3
    string_label: 3
    cell: 1
  dup_tier: 4                     # значение встречается в коде ≥ 2 раз (ничьи/связи): мутируем в последнюю очередь
  string_literals:
    max_len: 24                   # длиннее — это текст, а не код/идентификатор: переводчик страницы может его тронуть
    label_letters: "ACDEFGHKLMNPRTUVWXYZ"
  sql:
    id_column_patterns: ["^id$", "_id$", "^id_", "^pk$"]
  # K_err(X): ключи, которые даёт исполнение X с типичной ошибкой (spec §2.1 гейт 3, §7 err_mutants).
  # Ключ двойника не должен совпасть ни с одним из них: иначе честная ошибка выглядела бы как след буфера.
  err:
    enabled: true
    max_python: 40                # мутантов на задание: Python исполняется одним пакетом, дёшево
    max_javascript: 10            # JS — отдельный запуск node на мутант, поэтому меньше
    max_sql: 40                   # SQL — sqlite в памяти
    js_timeout_s: 1.5             # мутант с бесконечным циклом не должен тормозить сборку пула
    batch_chars: 14000            # размер пакета исходников в одном запуске run_python (лимит командной строки Windows)
    batch_timeout_s: 40
    mutant_timeout_s: 1.0         # секунд на мутант внутри пакета: мутант с бесконечным циклом снимается, пакет продолжается

# ----------------------------------------------------------------------------- честное совпадение ε
eps:
  default: { data_literal: 0.02, table_value: 0.02 }   # spec §2.1: до калибровки 0,02 (НЕ измерено)
  tier_multiplier: { 1: 1.0, 2: 1.0, 3: 1.5, 4: 2.0 }   # «прочая» роль (ярус 3) и значение с «ничьёй» (ярус 4) ближе к границе
  reject_inflation: 1.0           # ε ← ε·(1 + доля плотных отклонений: кандидат упал на заблуждение или ключ соседа)
  floor: 0.001
  cap: 0.5

# ----------------------------------------------------------------------------- гейт семейства и покрытие
gate:
  n: 50
  min_twin_share: 0.9             # доля экземпляров с валидным двойником у пригодного семейства
  max_honest_collision: 0.01      # доля ИТОГОВЫХ двойников, чей ключ совпал с ключом/заблуждением соседнего экземпляра пула (гейт 4: после отбраковки 0)
  max_natural_collision: 0.2      # плотность ключей семейства (доля кандидатов, отброшенных гейтом 4): выше — семейство тесное, двойник ненадёжен
  min_family_share: 0.85          # доля пригодных семейств реестра, дающих двойники на ≥ min_twin_share сидов

# ----------------------------------------------------------------------------- улики и агрегирование
evidence:
  trust_weight: 0.0               # вес улики в доверии: 0 до калибровки ε по людям (killer-features §3.4)
  calibrated: false
  twin_rate_per_session: 4        # заданий с двойником в сессии (spec §3, читает сервис выдачи заданий)
  one_hit_per: mutation_subclass  # mutation_subclass | mutation_class | family — «не больше одного попадания на класс»
  review_p_threshold: 1.0e-3      # P(≥ k | H0) для кандидата на «Требует подтверждения»
  rounding_tolerance: 0.0051      # ответ, округлённый до сотых, равен дроби ключа двойника (9586.67 ≈ 9586.666…)
  review_min_hits: 2
  review_min_after_warning: 1
  per_10k: 10000
  levels:
    confirmed: confirmed
    note: note
    under_review: under_review
  cap_before_warning: note        # попадание до предупреждения не выше «С оговоркой»
  cap_a11y_mode: note             # в режиме доступности не выше «С оговоркой», UNDER_REVIEW никогда
  auto_ban: false                 # не меняется: автоматического бана нет

# ----------------------------------------------------------------------------- «Подтверждение за 5 минут»
verification:
  n_trace_questions: 3
  max_skill_questions: 2
  hard_grades: [middle, senior]   # «трудное» по грейду семейства, если у задания нет оценки сложности b
  hard_b_min: 0.0                 # или b ≥ 0
  fast_ratio: 0.5                 # «быстро»: время ≤ 0,5 медианы семейства
  matches_min_ratio: 0.67         # доля баллов рубрики ≥ 0,67 → «соответствует»
  above_min_ratio: 1.0
  rubric_max: 2
  variant_tries: 4                # семейство со своим двойником (Family.twin): производных seed для поиска другого литерала
  skill_aliases:                  # must-навык → префиксы модулей (config/taxonomy.yaml), которые его покрывают
    python: [python, py]
    sql: [sql]
    javascript: [js, javascript]
    react: [react]
    typescript: [ts]
    git: [git]
    linux: [sh, linux]
    http: [http]
    css: [css]
    html: [html]
    docker: [devops_core]
    kubernetes: [devops_core]
    nginx: [devops_core]
    ci_cd: [devops_core]
    gitlab_ci: [devops_core]
    github_actions: [devops_core]
    cron: [devops_core, git_linux]
    bash: [devops_core, git_linux]
    pytest: [qa_testing, python_core]
    manual_testing: [qa_testing]
    unit_testing: [qa_testing]
    test_automation: [qa_testing]
    api_testing: [qa_testing, http_api]

# ----------------------------------------------------------------------------- песочница «Попробуй списать»
sandbox:
  n_items: 4
  language_order: [python, javascript, sql, python]
  max_build_attempts: 60

# ----------------------------------------------------------------------------- тексты (рус.; без «θ», без обвинений)
texts:
  levels_ru:
    confirmed: "Подтверждена"
    note: "С оговоркой"
    under_review: "Требует подтверждения"
  states_ru:
    none: "Наблюдений нет"
    warning: "Первое наблюдение: состояние предупреждения"
    evidence: "Повтор после предупреждения: материал для методиста"
    review_candidate: "Кандидат на «Требует подтверждения»: решает методист"
  phase_ru:
    before_warning: "до предупреждения"
    after_warning: "после предупреждения"
    unknown: "момент предупреждения не определён"
  matched_ru:
    key: "ключ экрана"
    twin_key: "ключ копии из буфера обмена"
    twin_err: "типичная ошибка на тексте из буфера обмена"
    twin_token: "значение, которого нет на экране"
    distractor: "типичная ошибка"
    none: "ни один из ключей"
  verdict:
    twin_exact: >-
      Ответ «{answer}» совпал с результатом выполнения текста, скопированного со страницы ({twin_key}),
      а не с результатом для условия, показанного на экране ({key}). В копии изменено одно значение:
      {from} → {to} (строка {line}). Это наблюдение о тексте, а не вывод о способе получения ответа.
    twin_err: >-
      Ответ «{answer}» не совпал ни с ключом экрана ({key}), ни с ключом копии ({twin_key}), но получается при типичной
      ошибке на тексте из буфера обмена (изменено одно значение: {from} → {to}) и не получается при типичных ошибках
      на показанном условии. Это только контекст: возможно совпадение.
    twin_token: >-
      Ответ «{answer}» не совпал ни с ключом экрана ({key}), ни с ключом копии ({twin_key}), но содержит
      значение «{to}», которого нет на экране. Это только контекст: возможна опечатка.
    correct: "Ответ «{answer}» совпал с ключом для показанного условия ({key}). Расхождений с экраном нет."
    misconception: >-
      Ответ «{answer}» совпал с типичной ошибкой ({tag}). Ключ копии ({twin_key}) не совпал: наблюдений
      по буферу обмена нет.
    other: >-
      Ответ «{answer}» не совпал ни с ключом экрана ({key}), ни с ключом копии ({twin_key}).
      Наблюдений по буферу обмена нет.
  probability_line: >-
    Вероятность такого совпадения у честного кандидата: {p} (модельная оценка, не измерена на людях);
    ожидаемо {n} таких случаев на 10 000 сессий.
  checklist:
    self_paste: "Вставка в собственное поле ответа"
    misconception: "Устойчивое заблуждение"
    glyphs: "Путаница глифов"
    stale_clip: "Устаревшая копия (другой показ задания)"
    a11y_mode: "Режим доступности"
  checklist_status_ru:
    ok: "не подтверждается"
    attention: "требует внимания"
    excluded: "ответ исключён из улики"
    unknown: "нет данных"
  checklist_notes:
    self_paste_yes: "Ответ получен вставкой из собственного поля ответа."
    self_paste_no: "Вставки в собственное поле не было."
    misconception_yes: "Ответ совпал с типичной ошибкой «{tag}»."
    misconception_no: "Ответ не совпал ни с одной из известных ошибок этого задания."
    glyphs_ok: "Заменён токен {from} → {to}: эта пара не относится к путаемым при мелком шрифте."
    glyphs_attention: "Заменён токен {from} → {to}: пара может путаться при мелком шрифте."
    stale_unknown: "Идентификатор показа не передан."
    stale_mismatch: "Копия относилась к другому показу задания."
    stale_same: "Копия относилась к этому же показу."
    a11y_yes: "Режим доступности: попадания не выше уровня «С оговоркой»."
    a11y_no: "Режим доступности не включался."
  candidate_message: >-
    Ответ на задание #{variant} не соответствует показанному условию. Если это ошибка — оспорьте
    или пройдите короткое бесплатное подтверждение.
  candidate_actions: ["Оспорить", "Пройти подтверждение"]
  act_title: "Акт сверки: показано и скопировано"
  verification:
    title: "Подтверждение за 5 минут"
    subtitle: "Три вопроса по вашим же заданиям: одно значение изменено, ответ объясняется вслух."
    uncalibrated_label: "не откалибровано"
    trace_intro_answer: "В варианте #{variant} вы получили «{answer}»."
    trace_intro_plain: "В варианте #{variant}."
    trace_ask_code: >-
      Что выведет программа, если значение {from} в строке {line} заменить на {to}?
      Объясните вслух, что меняется по ходу выполнения.
    trace_ask_sql: >-
      Что вернёт запрос, если в таблице {table} значение {from} в столбце {column} заменить на {to}?
      Объясните вслух, почему.
    trace_ask_reseed: "Решите задание того же типа с другими числами и объясните вслух ход решения."
    rubric:
      - { score: 0, text: "Не получил результат даже с наводящими вопросами или не может объяснить ход решения." }
      - { score: 1, text: "Получил результат с подсказками или объясняет неуверенно: путает шаг, но находит ошибку сам." }
      - { score: 2, text: "Назвал верный результат и своими словами объяснил, где именно меняется значение." }
    listen_for:
      predict_output: >-
        Слушайте, называет ли кандидат шаги по порядку и в какой момент подставляется новое значение
        ({from} → {to}). Уверенный разбор «по шагам» важнее скорости.
      sql_result: >-
        Слушайте, называет ли кандидат порядок обработки запроса (отбор строк, группировка, сортировка, лимит)
        и где в нём участвует изменённое значение ({from} → {to}).
      generic: "Слушайте, может ли кандидат пересказать ход решения своими словами и найти, на что влияет изменение."
    skill_question_generic: >-
      Расскажите о случае, когда вы применяли {skill}: какая была задача, что выбрали и что сделали бы иначе.
    skill_rubric:
      - { score: 0, text: "Общие слова, нет конкретного случая." }
      - { score: 1, text: "Есть случай, но без деталей решения и компромиссов." }
      - { score: 2, text: "Конкретный случай, понятные детали и осознанные компромиссы." }
    skill_listen_for: "Слушайте конкретику: масштаб, ограничения, что пошло не так и как исправили."
    skill_templates:
      kafka: "Как вы гарантируете порядок и доставку сообщений в Kafka, и что происходит при перебалансировке потребителей?"
      docker: "Чем образ отличается от контейнера, и как вы уменьшаете размер образа и ускоряете сборку?"
      redis: "Для каких задач вы использовали Redis, и как выбирали политику вытеснения и срок жизни ключей?"
      kubernetes: "Что происходит с запросом к сервису в Kubernetes от Ingress до пода, и где это ломается чаще всего?"
      postgresql: "Как вы находите медленный запрос в PostgreSQL и как решаете, нужен ли индекс?"
      celery: "Как вы делаете задачи Celery повторяемыми без дублей и что делаете с зависшими задачами?"
    result_ru:
      matches: "соответствует"
      above: "выше"
      below: "ниже"
    result_badge_ru:
      matches: "Подтверждено вживую"
      above: "Подтверждено вживую"
      below: "Не подтверждено вживую"
  sandbox:
    banner: "Списывайте как угодно: чат-бот, скриншот, IDE. После ответа вы увидите, что именно заметила система."
    readme_note: "Копирование проверяйте с ноутбука: поведение на мобильных не проверено."
    caught: "Вы копировали текст — пойман двойником: ответ {answer} получен для текста из буфера обмена, на экране было {key}."
    correct: >-
      Ответ верный: скриншот или ручной ввод двойник не ловит — здесь работает подтверждение за 5 минут.
    token: "В ответе есть значение {to}, которого нет на экране: это след текста из буфера обмена (только контекст)."
    err_twin: "Ответ получается при типичной ошибке на тексте из буфера обмена, а не на экране (только контекст)."
    misconception: "Ответ совпал с типичной ошибкой: двойник не сработал, но ответ неверный."
    other: "Ответ не совпал ни с одним из ключей: двойник не сработал (ошибка, догадка или другой способ)."
    blank: "Ответа нет."
    summary: "Поймано двойником: {caught} из {total}. Верных ответов, которые двойник не ловит: {correct}."
    channel_ru:
      clipboard_text: "копирование текста"
      screen_or_retyped: "скриншот, ручной ввод или решение по экрану"
      misconception: "типичная ошибка"
      unknown: "канал не определён"
  report_legend:
    same_key: "правка не изменила ответ (литерал не влияет на результат): перебор продолжается"
    in_distractors: "ключ правки совпал с известным заблуждением: кандидат отклонён"
    in_k_err: "ключ правки совпал с ключом типичной ошибки (K_err, исполнение мутантов задания): кандидат отклонён"
    exec_failed: "правка сломала программу: кандидат отклонён"
    messy_key: "ключ правки — длинная дробь, которую чат-бот округлит иначе: кандидат отклонён"
    edit_gate: "правка не прошла гейты малозаметности (один токен, длина ±1, глифы)"
    no_values: "для литерала нет значения, не пересекающего порог и не создающего «ничью»"
    pool_collision: "ключ правки совпал с ключом другого экземпляра пула"
    empty_key: "пустой ключ правки"
    generate_failed: "семейство не сгенерировало экземпляр на этом сиде"
  twin_reasons_ru:
    ok: "двойник построен"
    format_unsupported: "формат вне MVP двойников"
    answer_mode_not_text: "ответ выбирается из вариантов: ключ двойника совпал бы с вариантом-дистрактором"
    language_not_executable: "язык не исполняется офлайн-исполнителем"
    no_code: "в задании нет кода или данных"
    key_not_reproducible: "ключ не воспроизводится исполнением показанного кода"
    executor_failed: "офлайн-исполнитель не смог запустить показанный код"
    no_candidates: "в коде нет литерала данных, пригодного для подмены"
    all_candidates_rejected: "все кандидаты отклонены гейтами"
