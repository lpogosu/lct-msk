# Справочник специализаций, грейдов, модулей теста и отраслей.
# Единый источник истины для тестирования (blueprint) и подбора (категории).
version: 1

# Общая шкала уровня (theta) на каждую специализацию; пороги грейдов (cut) — нижняя граница грейда.
# Балл для UI: S = base + per_theta * theta  (линейка 300–600).
score_scale:
  base: 500
  per_theta: 100

# Грейд — уровень НАВЫКОВ, а не стаж (ответы организаторов, DECISIONS п. 29): якоря описывают, что человек умеет
# делать; годы опыта — только ориентир для подсказки в опросе, не критерий и в Score не входят.
grades:
  - code: intern
    name: Стажёр
    cut: -2.0
    anchor: Решает учебные задачи по подсказкам; базовые понятия знает, без помощи разбирает не всё
  - code: junior
    name: Junior
    cut: -1.0
    anchor: Выполняет типовые задачи по готовому образцу и разбирается с типичными ошибками; ориентир по опыту — до 1,5 лет, не критерий
  - code: middle
    name: Middle
    cut: 0.0
    anchor: Самостоятельно доводит фичу от постановки до релиза, выбирает подходы и замечает риски; ориентир по опыту — 1,5–4 года, не критерий
  - code: senior
    name: Senior
    cut: 1.0
    anchor: Проектирует решения и отвечает за качество системы, находит причины сложных сбоев и учит других; ориентир по опыту — от 4 лет, не критерий

modules:
  python_core: { name: Python }
  sql: { name: SQL и базы данных }
  http_api: { name: HTTP и API }
  algo: { name: Алгоритмы и структуры данных }
  git_linux: { name: Git и Linux }
  js_core: { name: JavaScript / TypeScript }
  react: { name: React }
  html_css: { name: HTML и CSS }
  qa_testing: { name: Тестирование ПО }
  devops_core: { name: DevOps и инфраструктура }
  # Модули проверочного набора по вакансии (навык внутри модуля). Ни в одном blueprint их нет: стандартный тест и грейд
  # они не меняют, задачи выдаются только как проверочный набор (docs/MATCHING.md, families/skills).
  redis_core: { name: Redis }
  mq_core: { name: Очереди сообщений }
  fastapi_core: { name: FastAPI }
  pg_core: { name: PostgreSQL (особенности) }

# status: active — тест работает; survey_only — опрос доступен, теста пока нет (лист ожидания).
specializations:
  - code: backend_python
    name: Backend (Python)
    direction: backend
    status: active
    blueprint:            # квоты модулей стандартного теста категории
      python_core: 0.35
      sql: 0.20
      http_api: 0.20
      algo: 0.15
      git_linux: 0.10
  - code: frontend_js
    name: Frontend (JS/TS)
    direction: frontend
    status: active
    blueprint:
      js_core: 0.35
      react: 0.25
      html_css: 0.15
      http_api: 0.15
      algo: 0.10
  - code: fullstack
    name: Fullstack
    direction: fullstack
    status: derived       # подтверждены обе квалификации; грейд = минимальный из двух
    derived_from: [backend_python, frontend_js]
  - { code: data_ml, name: Data Science / ML, direction: data, status: survey_only }
  - code: devops
    name: DevOps / SRE
    direction: devops
    status: active
    blueprint:
      devops_core: 0.55     # Docker, compose, YAML, cron, nginx, k8s, CI, bash, права: 11 семейств
      git_linux: 0.25       # Linux и Git: 5 общих семейств
      http_api: 0.20        # коды ответа, кеш, rate limit: 3 общих семейства
  - code: qa
    name: QA / тестирование
    direction: qa
    status: active
    blueprint:
      qa_testing: 0.50      # тест-дизайн, pytest, моки, покрытие, данные, API-проверки: 11 семейств
      http_api: 0.20        # 6 общих семейств (пагинация, коды, REST, идемпотентность, JWT, rate limit)
      sql: 0.20             # 7 общих семейств
      git_linux: 0.10       # 3 общих семейства
  - { code: mobile, name: Mobile, direction: mobile, status: survey_only }
  # UI/UX-дизайн: по опросу, тест в дорожной карте. Как проверять объективно — docs/TESTING_MECHANISM.md, раздел «Дизайнеры».
  - { code: uiux_design, name: UI/UX-дизайн, direction: design, status: survey_only }
  - { code: infosec, name: Информационная безопасность, direction: security, status: survey_only }
  - { code: backend_go, name: Backend (Go), direction: backend, status: survey_only }
  - { code: backend_java, name: Backend (Java/Kotlin), direction: backend, status: survey_only }

# «Сфера бизнеса» (в UI; код `industries`) — фасет интереса кандидата (фильтр), в Score не входит.
industries:
  - { code: fintech, name: Финтех }
  - { code: ecommerce, name: E-commerce и ритейл }
  - { code: gov, name: Госсектор }
  - { code: industry, name: Промышленность }
  - { code: telecom, name: Телеком }
  - { code: media_games, name: Медиа и игры }
  - { code: edtech, name: Образование }
  - { code: medtech, name: Медицина }
  - { code: logistics, name: Логистика }
  - { code: other, name: Другое }
