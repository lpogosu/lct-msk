# Рантайм «Антиподсказчика»: выдача двойников в сессии, предрасчёт, песочница жюри, лента сверок в лаборатории.
# Пороги улик, тексты и параметры генерации двойников — в config/anticheat.yaml; здесь только то, что относится к
# сервису (время ожидания, потоки, лимиты запросов). Источник: _internal/design/spec-antiassist.md §7, killer-features §2.1.
version: 1

issue:
  # Двойник считается заранее (предрасчёт пула: `uv run python -m app.services.anticheat.precompute` или кнопка
  # «Посчитать двойники» в лаборатории): это запуски кода, у части семейств — секунды. Если для выданного экземпляра его
  # ещё нет, можно достроить на месте, но не дольше этого времени (секунды); 0 — достройка выключена, берутся только
  # готовые двойники. Не успели — задание выдаётся без подмены (пропуск, а не ложное срабатывание). По умолчанию 0:
  # ожидание кандидата дороже одного задания без двойника, а тесты платформы не должны запускать подпроцессы.
  lazy_budget_s: 0.0
  lazy_workers: 4
  # Версия формата clip для клиента (сам текст подмены клиент получает только как clipboard_text)
  clip_version: "clip-v1"
  render_id_prefix: "rd"

precompute:
  workers: 6                  # потоков: каждый двойник — несколько запусков подпроцессов
  per_family_default: 40      # сколько свободных экземпляров семейства обработать за запуск
  batch_commit: 10            # коммит каждые N двойников: прерванный предрасчёт не теряет сделанное

events:
  # События «копирование»: copy | cut | dragstart. self_paste — вставка своего текста в поле ответа (улику не даёт).
  copy_types: [copy, cut, dragstart]
  self_paste_type: self_paste

lab:
  list_limit: 200
  list_limit_max: 500
  statuses: [open, verification_assigned, dismissed]
  note_max_chars: 500

sandbox:
  # Мини-тест строится параллельно и ограничен по времени: у части семейств двойник считается десятки секунд.
  build_budget_s: 20.0
  build_workers: 8
  candidates_per_slot: 3      # запасных семейств на каждое из заданий: быстрые обгоняют медленные
  # Запас готовых заданий с двойниками: прогревается в фоне при старте демо-режима, мини-тест собирается из него сразу
  bank_per_language: 6
  bank_warm_budget_s: 240.0
  start_rate: { capacity: 20, period_s: 600 }     # новых мини-тестов с одного адреса (жюри за одним NAT)
  score_rate: { capacity: 30, period_s: 600 }
  max_answer_chars: 300
  result_retention_hours: 72

# Тексты лаборатории и песочницы (рус.; без «θ», без обвинений: только наблюдаемые факты). Тексты акта и вердикты —
# в config/anticheat.yaml → texts.
texts:
  label_session: "Сессия кандидата {name}, задание {seq}, вариант {variant}"
  label_session_anon: "Сессия кандидата {code}, задание {seq}, вариант {variant}"
  label_sandbox: "Песочница жюри, задание {no}, вариант {variant}"
  headline:
    twin_exact: "Ответ совпал с копией, а не с экраном"
    twin_err: "Ответ получается при типичной ошибке на копии"
    twin_token: "В ответе есть значение, которого нет на экране"
    correct: "Ответ совпал с экраном"
    misconception: "Типичная ошибка: копия не затронута"
    other: "Ответ не совпал ни с экраном, ни с копией"
  lead_ru: >-
    Когда кандидат копирует условие, в буфер попадает та же задача с одним изменённым числом.
    Решая по экрану, ответ копии получить нельзя.
  means_title: "Что это значит"
  means_exact: >-
    Скорее всего, условие решали вне страницы — в чат-боте или интерпретаторе. Это не приговор: кандидат может
    оспорить, а работодатель увидит только итоговый уровень доверия. Скриншот такая проверка не ловит, поэтому
    следующий шаг — подтверждение за 5 минут по собственным заданиям кандидата.
  means_context: >-
    Это только контекст: совпадение с копией неполное, возможна опечатка или совпадение. Решение за методистом.
  means_other: "Наблюдений по буферу обмена нет: ответ не связан с копией."
  stats:
    probability:
      caption: "шанс случайно получить ответ копии, решая по экрану (модельная оценка, не измерена на людях)"
      floor_label: "< 0,1%"
    first: { value: "впервые", caption: "в этой сессии; при копировании кандидат видел предупреждение" }
    repeat: { value: "повторно", caption: "после предупреждения: кандидат видел тост при первом копировании" }
    unknown_phase: { value: "без даты", caption: "момент предупреждения не определён: копирования в журнале нет" }
    scored_wrong: { value: "неверно", caption: "так ответ засчитан в тесте, без отдельного штрафа" }
    scored_right: { value: "верно", caption: "так ответ засчитан в тесте" }
    weight_zero: { value: "вес 0", caption: "в уровне доверия, пока улика не откалибрована" }
    weight_set: { value: "вес {w}", caption: "в уровне доверия: ε откалибрована по людям" }
  review_status_ru:
    open: "ждёт решения методиста"
    verification_assigned: "назначено подтверждение"
    dismissed: "отметка снята"
  actions_ru:
    assign_verification: "Назначить подтверждение"
    dismiss: "Снять отметку"
    reopen: "Вернуть в очередь"
  candidate_code_len: 4
  sandbox:
    state_ru: "песочница жюри"
    next_step_ru: >-
      Скриншот, ручной ввод и ИИ-панель браузера двойник не ловит. Против них работает «Подтверждение за 5 минут»:
      живой разбор вашего же варианта с одним изменённым числом.
  list_note_ru: >-
    Ответ двойника уже засчитан в тесте неверным. Вес улики в доверии 0, пока ε не откалибрована по людям; автоматического
    бана нет — решает методист. Скриншот, ИИ-панель браузера и ручной ввод двойник не ловит: для них есть подтверждение за 5 минут.
  precompute_started_ru: "Расчёт запущен в фоне: обновляйте «Покрытие» — готовые двойники появятся по мере расчёта"
  precompute_busy_ru: "Расчёт уже идёт: дождитесь окончания"
