# Доверие и безопасность: метка «Проверенная компания», жалобы кандидатов, эвристики, снижение квоты.
# Метка добровольная и НИКОГДА не блокирует основной сценарий: без неё компания работает как раньше.
# Все числа и подписи — здесь, в коде их нет. Концепция и «что реализовано / что в плане» — docs/TRUST_AND_SAFETY.md.
version: 1

# --- Проверка реквизитов компании ----------------------------------------------------------------------------------------
verification:
  # mock — встроенный учебный реестр вымышленных компаний (app/trust/data/mock_egrul.json). Реальный ЕГРЮЛ/ФНС-API подключается
  # адаптером EgrulProvider без изменения остального кода (в MVP не подключён).
  registry: mock
  active_status: действующая        # статус записи реестра, при котором реквизиты считаются живыми
  name_match_min_ratio: 0.8         # доля совпавших слов названия (после нормализации «ООО», кавычек, регистра)
  levels:
    none:
      label: Не проверена
    requisites:
      label: Реквизиты проверены
      hint: ИНН и ОГРН прошли контрольную сумму, компания найдена в реестре и действует, название совпало
    domain:
      label: Домен подтверждён
      hint: Дополнительно к реквизитам — корпоративный email сотрудника на домене компании из реестра
  checks:                           # подписи проверок для работодателя (что прошло, что нет)
    inn_checksum: Контрольная сумма ИНН
    ogrn_checksum: Контрольная сумма ОГРН
    registry_found: Компания найдена в реестре
    inn_ogrn_match: ИНН и ОГРН относятся к одной записи
    registry_active: Статус «действующая»
    name_match: Название совпадает с реестром
    inn_unique: ИНН не занят другой компанией на платформе
    domain_match: Домен корпоративной почты совпадает с доменом из реестра
  revoke_reasons:                   # причины, которые методист/администратор может указать при отзыве метки
    complaints: Подтверждённые жалобы кандидатов
    wrong_data: Реквизиты не соответствуют компании
    other: Другое

# --- Жалобы и модерация --------------------------------------------------------------------------------------------------
complaints:
  window_days: 90                   # окно, в котором считаются жалобы для квоты и эвристик
  comment_max_len: 300
  # Открытая или подтверждённая жалоба от N разных кандидатов за окно → квота приглашений ×quota_factor.
  # Отклонённые модератором жалобы не считаются.
  quota_threshold: 3
  quota_factor: 0.5
  quota_label: жалобы кандидатов
  # Подтверждённая модератором жалоба с такой причиной снимает метку «Проверенная компания».
  revoke_badge_on_upheld: [fake_vacancy, payment_request, collects_resume]
  statuses:
    open: Ожидает разбора
    upheld: Подтверждена
    dismissed: Отклонена
  targets: [invitation, vacancy]

# --- Автоматические сигналы для очереди модерации (подсчёт «на лету», ничего не блокируют) --------------------------------
flags:
  many_invites_no_outcomes:
    min_sent: 20                    # отправлено приглашений за окно …
    window_days: 30
    label: Много приглашений, ни одного принятого и ни одного ответа с контактом
  vacancy_idle:
    open_days: 30                   # вакансия опубликована дольше этого …
    label: Вакансия висит долго, откликов и контактов нет
  salary_below_brief:
    min_invitations: 2              # приглашений с зарплатой ниже вилки брифа (по нижней границе) …
    tolerance_ratio: 0.9            # … если from приглашения < 0.9 · from брифа
    label: В приглашениях зарплата ниже, чем в брифе
  salary_far_below_market:
    # Верхняя граница вилки брифа (в пересчёте на «до НДФЛ») ниже ratio · нижнего квартиля рынка своего направления × грейда
    # (открытые данные, config/market.yaml). Только сигнал для модерации; на подбор и Score не влияет.
    ratio: 0.8
    min_needs: 1
    statuses: [active, parsed]
    label: Вилка брифа сильно ниже рыночной
  terms_discrepancy:
    min_events: 2                   # сообщения кандидатов «условия не совпали» (журнал надёжности R)
    label: Кандидаты сообщают о расхождении условий
