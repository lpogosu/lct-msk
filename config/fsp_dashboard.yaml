# Панель ФСП «Кадровый резерв»: только агрегаты, никаких ПДн (docs/FSP_INTEGRATION.md, раздел «Панель ФСП: кадровый резерв»;
# DECISIONS.md п. 31.4). Все пороги и справочники панели — здесь; в app/services/fsp_dashboard магических чисел нет.
version: 1

privacy:
  # k-анонимность: любая ячейка, где людей меньше k, отдаётся как «<k» без числа (n = 0 не скрываем: нуль никого не раскрывает).
  k_min: 5
  # Спрос работодателей — это компании, а не люди: ячейка спроса скрывается, пока в ней меньше этого числа компаний.
  k_min_companies: 2
  # Вторичное подавление: если в разбиении (взаимоисключающие строки) скрыта ровно одна ячейка, а итог показан,
  # её можно вычесть. Тогда прячем ещё и наименьшую из показанных.
  complementary_suppression: true

# Окно временного ряда и размер корзины.
series:
  weeks: 12

# Воронка: стадии вложены (каждая следующая — подмножество предыдущей), поэтому числа монотонно не растут.
funnel:
  stages:
    - { key: linked,    label: "Участник соревнований ФСП (привязан ФСП ID)" }
    - { key: tested,    label: "Прошёл тест" }
    - { key: confirmed, label: "Подтверждённая категория" }
    - { key: shortlisted, label: "Попал в подборки" }
    - { key: invited,   label: "Получил приглашение" }
    - { key: mutual,    label: "«Взаимно»" }
    - { key: hired,     label: "Нанят" }

salary:
  # Вилки в приглашениях бывают «на руки» и «до НДФЛ». Для сравнения всё приводим к «на руки»; «до НДФЛ» — обратный пересчёт.
  ndfl_rate: 0.13
  # Медиана считается по первой оферте в приглашении (середина вилки).
  basis_shown: [net, gross]

# Спрос = компании, у которых за окно series.weeks была потребность (не черновик) или есть опубликованная вакансия в категории.
# Предложение = спортсмены ФСП с подтверждённой категорией, открытые к предложениям. Оценка по числу спортсменов на компанию:
# меньше `ok` — «не хватает», больше `surplus` — «избыток», между — «баланс».
# Пороги 0,5 и 1,0 выбраны по фактическому распределению (в реестре на компанию приходится 0–1,25 спортсмена на категорию);
# прежние 1,0 и 3,0 делали «не хватает» почти везде и панель ничего не различала.
demand:
  athletes_per_company_ok: 0.5
  athletes_per_company_surplus: 1.0

# Федеральные округа → коды субъектов РФ (как в реестре ФСП и в app/services/profile/regions.py).
districts:
  - { code: cfo,  name: Центральный,        regions: ["31","32","33","36","37","40","44","46","48","50","57","62","67","68","69","71","76","77"] }
  - { code: szfo, name: Северо-Западный,    regions: ["10","11","29","35","39","47","51","53","60","78","83"] }
  - { code: yfo,  name: Южный,              regions: ["01","08","23","30","34","61","80","81","82","84","85","91","92"] }
  - { code: skfo, name: Северо-Кавказский,  regions: ["05","06","07","09","15","20","26"] }
  - { code: pfo,  name: Приволжский,        regions: ["02","12","13","16","18","21","43","52","56","58","59","63","64","73"] }
  - { code: ufo,  name: Уральский,          regions: ["45","66","72","74","86","89"] }
  - { code: sfo,  name: Сибирский,          regions: ["04","17","19","22","24","38","42","54","55","70"] }
  - { code: dfo,  name: Дальневосточный,    regions: ["03","14","25","27","28","41","49","65","75","79","87"] }
unknown_district: { code: unknown, name: Не указан }

disciplines_order: [product, algo, infosec, robotics, bas]

# Демо-история подбора для витрины (app/services/demo/fsp_reserve.py): на синтетике в реестре-моке за недели сценария
# набирается слишком мало приглашений и найма, чтобы панель показывала осмысленные числа и держала k-анонимность.
# Это отдельная, помеченная «демо-историей» выборка поверх мира; в продукте её нет.
demo_history:
  enabled: true
  seed: 20261009
  weeks: 12
  invitations: 170
  fsp_share: 0.5            # доля приглашений, ушедших спортсменам ФСП (их в мире ~11 %: иначе на панели нечего показывать).
                            # Эффекта «ФСП сильнее» в историю НЕ закладываем: все исходы и вилки одинаковы для обеих групп
  status_mix:               # итоговые статусы приглашений
    hired: 0.12
    interview_open: 0.10    # «Взаимно», собеседование/решение пока не принято
    not_matched: 0.08       # «Взаимно», но не сошлись
    declined: 0.28
    expired: 0.17
    withdrawn: 0.05
    sent: 0.20              # ещё ждут ответа
  ndfl_gross_share: 0.2     # доля вилок «до НДФЛ»
  offer_by_grade:           # середина вилки на руки, руб./мес
    intern: 45000
    junior: 90000
    middle: 190000
    senior: 310000
  offer_spread: 0.15
  linked_spread_weeks: 6    # привязки ФСП ID растягиваем по первым неделям окна (иначе все 45 — «в день seed»)
  min_fsp_candidates: 20    # в малом мире (тесты, --candidates 40) историю не строим: на панели всё равно было бы «<5»
  respond_days: 7           # срок ответа в приглашении
  step_hours: 30            # шаг между событиями приглашения: отправлено → «Взаимно» → контакт → итог
  sent_window_days: 3       # «ждут ответа» отправлены не раньше чем столько дней назад
  field: "Демо-история подбора (архив)"   # метка компаний истории: по ней seed находит свои строки и не дублирует их
  email_domain_suffix: history.demo.example
  companies:                # вымышленные компании без сотрудников и входа; сбрасываются вместе с демо-миром
    - Полярный Узел
    - Иней Лаб
    - Ковыль Софт
    - Сизый Сервис
    - Дальний Стек
    - Ясень Системы
    - Тополь Дата
    - Рябина Облако
