# Цифровой паспорт навыков: подписанные учётные данные W3C VC 2.0 / Open Badges 3.0 (docs/CREDENTIALS.md).
# Издатель — демонстрационный: НЕ официальный документ ФСП. Ключ подписи — в настройках/секрет-файле, не здесь.
issuer:
  name: "Взаимно — демонстрационный издатель"
  description: "Демонстрационный издатель платформы «Взаимно». Не является официальным документом ФСП или иной организации."
  disclaimer: "Демонстрационный издатель: документ не является официальным сертификатом ФСП."
validity_days: 365            # срок действия паспорта; после — «истёк срок» (категория актуальна ограниченно)
max_active_per_user: 30       # защита от засорения реестра выдачи
status_list:
  size_bits: 131072           # минимум по спецификации Bitstring Status List (16 КиБ до сжатия)
  id: "1"
  ttl_ms: 300000
subject:
  id_prefix: "urn:vzaimno:subject:"     # псевдонимный id субъекта: HMAC(секрет, user_id), не обратим без секрета
  id_hex_len: 24
verify:
  max_body_bytes: 262144      # загрузка файла для проверки
  code_prefix: "vc"           # коды сверки паспорта начинаются с «vc» (PDF-коды — чистый hex)
method_path: "/api/docs"      # ссылка на методику в evidence (в проде заменить на страницу методики)
category:
  achievement_type: "Certification"
  score_scale: { min: 0, max: 1000, name: "Балл шкалы «Взаимно» (500 + 100 × уровень)" }
  sem_name: "Стандартная погрешность измерения (SEM), баллы шкалы"
fsp:
  achievement_type: "Achievement"
  # Минимизация: в паспорт попадают только эти поля публичной сводки результата. Без ЕКП, команды, точного места,
  # ссылки на протокол, ФИО и ФСП ID.
  allowed_fields: [discipline_label, level, year, outcome, place_band, role]
