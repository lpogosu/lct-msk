# Словари подбора: навыки (граф «навык → модули теста»), роли, софт-скиллы, форматы, города,
# маркеры must/nice, маркеры грейда, сигналы специализации.
# Используется парсером брифа (app/matching/brief_parser.py), резюме и экраном «Как мы проверим».
# Концепция §3.1.1, §4.2 (разбор брифа), §5.5 (граф навык → модули); spec-contact §3.1.
#
# Правила записи алиасов:
#  - всё в нижнем регистре, «ё» пишем как «е» (нормализация одинаковая для текста и словаря);
#  - кириллический алиас длиной ≥ 4 ловит словоформы: после него допускается окончание из ≤ 3 букв
#    («питон» → «питоне», «постгрес» → «постгресом»); короткие и рискованные алиасы — точные;
#  - алиасы уникальны внутри словаря навыков (проверяется тестом).
# modules — коды модулей из taxonomy.yaml; навык без модулей обязан иметь untestable: true
# (серый список «тестом не проверяется — проверьте на интервью»).
# spec — веса навыка для специализаций в разборе брифа (score_s += w); если не задан — берётся из категории.
version: 1

untestable_reasons:
  infra: Инфраструктура и эксплуатация тестом не проверяются — проверьте на интервью
  language: Язык или платформа вне тестируемых направлений — проверьте на интервью
  tech: Технология не покрыта модулями теста — проверьте на интервью
  data_ml: Data/ML пока не тестируется — проверьте на интервью
  mobile: Мобильная разработка пока не тестируется — проверьте на интервью
  qa: Инструменты QA тестом не проверяются — проверьте на интервью
  security: Информационная безопасность пока не тестируется — проверьте на интервью
  arch: Архитектурные навыки тестом не измеряются — обсудите на интервью
  process: Процессы и методологии тестом не измеряются — обсудите на интервью
  design: Дизайн пока тестом не проверяется (тест в дорожной карте) — посмотрите портфолио
  spoken: Иностранный язык тестом не проверяется — проверьте на интервью

