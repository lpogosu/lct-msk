# must / nice: маркеры в окне ±N токенов (spec-contact §3.1). Без маркера → must.
markers:
  # «желател» (а не «желательн») — чтобы ловить и краткую форму: «желателен опыт», «желательна».
  nice: [желател, "хорошо, если", хорошо если, будет плюсом, будут плюсом, является плюсом, плюсом будет, большим плюсом, будет преимуществом, будут преимуществом, преимуществом, как плюс, приветству, опциональн, не обязательн, необязательн, по желанию, хорошо бы, было бы здорово, бонусом, nice to have, nice-to-have, is a plus, would be a plus, will be a plus, optional, preferred, плюсом]
  must: [обязательн, нужен, нужна, нужно, нужны, требуется, требуются, требовани, необходим, уверенн, опыт с, опыт работы с, знание, знания, владение, умение, must have, must-have, required, must, хорошее знание, отличное знание, глубокое понимание]

# Маркеры грейда (spec-contact §3.1, п. 4). «+» после маркера (middle+) → сдвиг к следующему грейду.
grade_markers:
  intern: [стажер, стажера, стажеров, стажерку, стажировк, intern, internship, trainee, практикант, без опыта, студент, студентов]
  junior: [junior, джун, джуна, джунов, джуниор, младший разработчик, младшего разработчика, начинающ, entry level, entry-level]
  middle: [middle, мидл, мидла, мидлов, миддл, mid-level, mid level, middle-разработчик]
  senior: [senior, сеньор, сеньора, синьор, синьора, сениор, синиор, старший разработчик, старшего разработчика, ведущий разработчик, ведущего разработчика, lead developer]

# Если маркеры грейда противоречат друг другу («Ищем Senior …, будет менторить джунов»), берём только те,
# что стоят в ±window_tokens от роли, сигнала специализации или слова ниже (основы, по началу токена).
grade_context:
  window_tokens: 2
  anchor_stems: [разработчик, программист, инженер, специалист, девелопер, developer, engineer, ищем, ищу, нужен, нужна, требуется, вакансия, позици, приглашаем, looking, hiring]

# «Опыт от N лет»: слова опыта и числительные словами.
experience:
  words: [опыт, опыта, опытом, стаж, experience]
  number_words: { один: 1, одного: 1, года: 1, полутора: 1.5, двух: 2, два: 2, трех: 3, три: 3, четырех: 4, четыре: 4, пяти: 5, пять: 5, шести: 6, семи: 7, десяти: 10, полугода: 0.5 }

