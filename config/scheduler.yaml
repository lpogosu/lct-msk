# Встроенный планировщик фоновых задач (app/services/scheduler): asyncio-цикл в lifespan приложения.
# Все периоды и пороги живут здесь; в коде магических чисел нет. Хардненинг п. 9.
#
# Один процесс uvicorn — одна задача: между процессами/контейнерами задачу берёт тот, кто получил
# рекомендательную блокировку PostgreSQL (pg_try_advisory_xact_lock), остальные пропускают прогон.
# Время суточных задач — UTC (в Москве UTC+3, переходов на летнее время нет: 00:00 UTC = 03:00 МСК).
# В тестах (VZ_ENV=test) планировщик не запускается; снаружи его можно выключить: enabled: false или VZ_SCHEDULER_ENABLED=false.
version: 1

enabled: true
tick_s: 5            # как часто цикл проверяет, какая задача подошла
startup_delay_s: 15  # пауза после старта приложения до первого прогона (миграции, прогрев)

jobs:
  # Применение сроков приглашений и откликов для всех сразу (истекло, «нет ответа», напоминания) и повтор вебхуков ATS:
  # концепция §4.3, app/services/contact/sweep.py. Источник истины — ленивое применение при чтении; задача нужна,
  # чтобы уведомления приходили без захода пользователя.
  contact_sweep:
    enabled: true
    every_s: 60
    limit: 1000        # строк за один проход (приглашения и отклики по отдельности)

  # Ночная калибровка заданий и CUSUM дрейфа семейств по всем тестируемым специализациям (spec-testing §3.9–3.10):
  # то же, что POST /api/lab/calibrate без специализации. Семейство с дрейфом уходит в карантин.
  calibration:
    enabled: true
    at_utc: "00:00"    # 03:00 по Москве: ночью нагрузки на тест нет

  # Хранение данных (152-ФЗ): удаление неподтверждённых аккаунтов, просроченных токенов и кодов, обезличивание IP в журнале
  # аудита, чистка сырых ответов реестра ФСП до нужных полей. Параметры — config/privacy.yaml.
  retention:
    enabled: true
    at_utc: "00:30"
