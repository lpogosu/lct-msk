# Персональные данные: удаление аккаунта и сроки хранения (152-ФЗ, хардненинг п. 1). Параметры читает
# app/services/account (удаление) и ночная задача retention планировщика (config/scheduler.yaml).
version: 1

# --- Право на удаление: DELETE /api/candidates/me и DELETE /api/companies/me --------------------------------------------
erasure:
  rate_limit: "5/3600"          # «N/секунд» на аккаунт: попытки подтверждения паролем считаются, неверный пароль тоже
  confirm_phrase: "УДАЛИТЬ"     # подтверждение для аккаунтов без пароля (вход через ФСП ID без заданного пароля)
  # Что остаётся после удаления: запись журнала аудита без ПДн (действие, роль, дата) и счётчики надёжности компаний
  # (reliability_events без ссылки на кандидата). Контакты, переписка, профиль, тесты и ответы удаляются каскадом.
  audit_action: account.erased

# --- Сроки хранения ------------------------------------------------------------------------------------------------------
retention:
  unverified_account_days: 7        # email не подтверждён дольше — аккаунт и его код удаляются (письмо не пришло/не тот адрес)
  email_code_days: 2                # сожжённые/просроченные коды подтверждения
  refresh_token_days: 30            # просроченные и отозванные refresh-токены (по сроку отзыва/истечения)
  fsp_auth_state_days: 1            # брошенные начатые входы через ФСП ID
  audit_ip_days: 180                # IP в журнале аудита обезличивается (поле ip → NULL), сами записи остаются
  consent_ip_days: 365              # IP и user-agent в записях согласий (сама запись и версия текста остаются)
  batch: 500                        # строк за один подход: ночная задача не держит длинную транзакцию (неподтверждённые аккаунты)

# --- Данные реестра ФСП: храним только используемые поля ----------------------------------------------------------------
fsp_registry:
  # Что остаётся от Athlete: sub и год рождения (политика по несовершеннолетним, app/services/fsp_link). ФИО, дата рождения
  # целиком, регион и организация платформе не нужны. От записей команды: id, название и размер состава без sub участников.
  minimize_stored_response: true
