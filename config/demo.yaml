  employers:                 # сотрудники отдела кадров демо-компаний — без ФИО, только роль
    role: Рекрутёр

# --- Админ-инструменты жюри (G3, DECISIONS 5) -----------------------------------------------------------------------
admin:
  # Импорт, ранжирование и метрики доступны администратору (все загрузки) и методисту — в том числе входу жюри
  # «Лаборатория» (staff.jury): методист видит, ранжирует и удаляет только свои загрузки.
  import:
    max_pairs: 20000         # строк в одном файле импорта
    max_briefs: 500          # разных брифов (вакансий) в одном импорте
    max_candidates: 5000     # разных кандидатов в одном импорте
    max_bytes: 20000000      # размер тела запроса (по заголовку Content-Length)
  # Простой формат жюри: три таблицы CSV или JSON — вакансии, кандидаты, разметка (app/services/demo/jury_simple.py)
  simple:
    max_vacancies: 200
    max_candidates: 2000
    max_labels: 20000
    max_text_chars: 5000            # текст вакансии (как у брифа в /eval/rank)
    max_self_description_chars: 3000
    max_warnings: 50                # сколько предупреждений вернуть (нераспознанные навыки и т. п.)
    unlabeled_as_irrelevant: true   # у размеченной вакансии неразмеченные кандидаты набора — rel 0 (ранжируются все)
    fsp_default_discipline: product # «fsp» числом без дисциплины = VSS в продуктовом программировании
    max_experience_months: 600
    skill_match_min_coverage: 0.6   # навык из ячейки «skills»: совпадение со справочником покрывает ≥ 60% текста
  rank:
    default_top: 20
    max_top: 200
  pairs:
    ks: [5, 10]              # P@5, P@10
    ndcg_k: 10
    relevant_from: 2         # rel ≥ 2 — релевантен (концепция §7.1)
    bootstrap: { n: 1000, seed: 20261005, alpha: 0.05 }
    min_briefs_for_ci: 2
  unconfirmed_group_label: Категория по опросу, не подтверждена
  validation_json: eval/out/validation.json   # относительно каталога backend/
  # Страница /lab/check «Проверка подбора на ваших данных»
  check:
    repo_pairs: eval/pairs_test.jsonl         # «Наш набор пар» (относительно backend/)
    default_top: 10                            # топ по брифу на странице
    max_top: 50
    csv_top: 20                                # строк на бриф в CSV топов
    relevant_below_max: 10                     # сколько релевантных «ниже топа» показать для ручной проверки
    text_preview_chars: 180                    # начало текста брифа в списке
    pseudonym_scope: jury-check                # «компания» для псевдонимов кандидатов банка платформы (слепая выдача)
    systems:                                   # подписи систем из ranks_top20 (VALIDATION.md, раздел 4)
      ours: Наш подбор (сквозной, места из файла)
      b0: B0 — случайный порядок в тех же категориях
      b1: B1 — BM25 по самоописанию (как поиск по резюме)
      b2: B2 — категория + точечная оценка уровня
      b3: B3 — TF-IDF «бриф ↔ самоописание»

# --- Как синтетический кандидат «проходит опрос» (ответы согласованы с его истинной специализацией) --------------------
survey:
  actions:                   # действие → частота за 12 месяцев (коды из config/testing.yaml → survey)
    backend_python: { server_api: regularly, sql_db: regularly, queues_cache: sometimes, ci_cd: sometimes }
    frontend_js: { ui_layout: regularly, spa_components: regularly, browser_debug: regularly, ci_cd: sometimes }
    qa: { manual_testing: regularly, autotests: regularly, sql_db: sometimes, ci_cd: sometimes }
    devops: { ci_cd: regularly, containers_infra: regularly, monitoring: regularly, queues_cache: sometimes }
  technology_by_skill:       # навык справочника → технология опроса (серые чипы «заявлено», в оценку не входят)
    python: python
    django: django_fastapi
    fastapi: django_fastapi
    drf: django_fastapi
    flask: django_fastapi
    javascript: javascript
    typescript: typescript
    react: react
    vue: vue_angular
    html: html_css
    css: html_css
    nodejs: nodejs
    postgresql: postgresql
    docker: docker
    kubernetes: kubernetes
    git: linux_git
    linux: linux_git
    pytest: test_frameworks
    jest: test_frameworks
    selenium: test_frameworks
    playwright: test_frameworks
    cypress: test_frameworks
    bash: linux_git
  recency: now

# --- Вход жюри /jury (DEMO_MODE): одноразовые кандидаты, экспресс-тест, роли без пароля -------------------------
# Одноразовый кандидат: аккаунт active без письма и без пароля (вход — токеном из /api/demo/jury/start), опрос
# заполняется настоящим сервисом по выбранной специализации, сессия теста помечается demo_assisted.
jury_entry:
  guest_email_domain: jury.demo.example.com
  default_specialization: backend_python
  default_grade: middle
  industries: [other]
  months_by_grade: { intern: 3, junior: 14, middle: 40, senior: 72 }   # стаж только для подсказки грейда на брифинге
  employer_company: severny_kod      # «Посмотреть глазами работодателя»: HR этой компании (пароль не печатается)
  lab_account: jury                  # «Лаборатория методиста»: staff.jury (только просмотр)
  start_rate: { capacity: 60, period_s: 3600 }   # одноразовых кандидатов с одного адреса (жюри за одним NAT)
  paths:                             # куда вести после входа
    candidate_express: /candidate/test/{session_id}
    candidate_full: /candidate/test/{session_id}
    employer: /employer/needs
    lab: /lab/sessions
    fsp: /fsp/reserve
