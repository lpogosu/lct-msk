  - { company: severny_kod, need: payments_backend, status: accepted,  note: "Взаимное «да», контакты раскрыты" }
  - { company: severny_kod, need: payments_backend, status: sent,      note: "Отправлено, кандидат ещё не открывал" }
  - { company: severny_kod, need: ui_frontend,      status: viewed,    note: "Открыто, ответа нет" }
