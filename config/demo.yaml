invitation_hours_ago:
  early: 336       # приглашения, которые должны успеть истечь или закрыться (14 дней назад)
  middle: 96
  late: 3          # «живые» (sent, viewed, countered) — свежие, срок ответа не истёк
  step_hours: 6    # шаг между событиями одной истории

