# Демо-мир и демо-инструменты «Взаимно» (DEMO_MODE, seed, автоответчик, режим жюри).
# Источники: концепция §7.3 и §11 (сценарий демо), DECISIONS п. 4, 5, 25; 02-compliance G2, G3, RK2.
# Всё, что похоже на число или список, живёт здесь — в коде демо-модуля магических чисел нет.
# Все компании, люди и контакты вымышленные: домены в зоне .example (зарезервирована IANA).
version: 1

# --- Популяция синтетических кандидатов (backend/eval/population.py — тот же генератор, что у валидации) ----
population:
  size: 300                  # сколько кандидатов создаёт seed (префикс популяции из 2000: те же люди, что в eval)
  seed: 20261005             # MASTER_SEED валидации: демо и `make validate` видят одних и тех же людей
  email_domain: cand.example.org
  fsp_share: 0.35            # доля с ФСП в генераторе; привязка — к спортсменам мок-реестра (их 60), поэтому не больше
  fsp_athlete_min_age: 18    # несовершеннолетних спортсменов реестра кандидатам не выдаём (отдельная политика)
  answer_seconds_min: 25     # время ответа симулянта на задание, с (реалистичная трасса для детекторов)
  answer_seconds_max: 90
  retry_extension: true      # принимать добор вверх, если уровень симулянта на это указывает
  commit_every: 5            # коммит в БД каждые N кандидатов (прерванный seed продолжается)
  blind_card_share: 1.0      # доля кандидатов с согласием на слепую карточку (иначе их нет в банке)
  search_mode_mix:           # режим поиска синтетических кандидатов
    active: 0.35
    open: 0.60
    hidden: 0.05
  weekly_invite_limit_mix: [3, 5, 5, 5, 10]   # лимит новых приглашений в неделю (выбор по кругу)
  # Добавочные кандидаты отдельных специализаций (seed_demo.py --add-specs qa,devops): свои диапазоны номеров, чтобы не
  # пересекаться с префиксом популяции eval (size ≤ 2000) и не сдвигать уже созданных людей. Все проходят свой тест.
  extra_specs:
    qa: { index_base: 5000, count: 40 }
    devops: { index_base: 6000, count: 40 }

# --- Пул одноразовых экземпляров ---------------------------------------------------------------------------
pool:
  specs: [backend_python, frontend_js, qa, devops]   # только тестируемые специализации: остальные семейства демо не нужны
  # Боевой размер. Переменная VZ_POOL_PER_FAMILY (локальный compose — 40, «быстрый режим») важнее этих двух чисел
  n_per_family: 200
  min_free: 50
  # Процессов генерации — VZ_POOL_WORKERS либо число ядер (не больше 8)

# --- Демо-аккаунты (пароль выводится из VZ_APP_SECRET и ключа: один секрет — один пароль, файл можно восстановить) --
accounts:
  domain: demo.example.com
  credentials_file: var/demo_accounts.md   # относительно каталога backend/; в .gitignore
  password_prefix: "Vz-"
  password_length: 10
  # Кандидатская «Мария» не заводится заранее: по сценарию §11 она регистрируется вживую (код приходит в Mailpit)
  fresh_registration_email: maria@demo.example.com

# Вымышленный публичный хост ATS: проверка SSRF его пропускает, доставку на него перехватывает демо-приёмник
company_webhook_host: ats.vzaimno-demo.example

