# --- Вебхук-приёмник ATS ---------------------------------------------------------------------------------------
webhook_sink:
  path: /api/demo/webhook-sink
  keep: 20                   # последние N событий
  response_body: ok

# --- Автоответчик синтетических кандидатов (G2, DECISIONS 4) ----------------------------------------------------
autoresponder:
  enabled: true
  tick_interval_s: 5
  delay_min_s: 30            # ответ через 30–90 с после отправки
  delay_max_s: 90
  counter_ratio_max: 1.2     # «Да, если»: to < min ≤ 1.2·to
  counter_comment: Готов(а) обсуждать, если условия по зарплате будут от указанной суммы.
  batch_limit: 200           # приглашений за один проход
  build_fence_days: 1        # на время сборки сценария граница «после сборки» уходит вперёд: заготовки с прошлыми датами не трогаем
  # Причина «Нет» из персоны (выбор по номеру кандидата: детерминированно, без глобального random)
  decline_reasons: [stack, other_process, not_looking, company, format, salary, stack, other_process]
  decline_comment: ""        # комментарий не пишем: контакты и ссылки до раскрытия запрещены
  review_note: Синтетический кандидат (демо)

# --- «Режим жюри» (RK2): подсвечиваем верный ответ, сессия помечается demo_assisted и исключается из метрик --------
jury_mode:
  default: false
  hint_requires_flag: true   # подсказка доступна только пока режим включён

# --- Часы -------------------------------------------------------------------------------------------------------
clock:
  presets:                   # кнопки «+1 день / +3 дня»
    plus_1d: { label: "+1 день", days: 1 }
    plus_3d: { label: "+3 дня", days: 3 }

# --- Служебные аккаунты ------------------------------------------------------------------------------------------
staff:
  jury:       { key: jury,       role: methodist, email: jury@demo.example.com,      title: "Жюри (лаборатория: просмотр и проверка подбора на своих данных)" }
  methodist:  { key: methodist,  role: methodist, email: metodist@demo.example.com,  title: "Методист" }
  admin:      { key: admin,      role: admin,     email: admin@demo.example.com,     title: "Администратор (импорт жюри, /api/admin)" }

# --- Персоны по сценарию §11 и ступенчатые кандидаты ---------------------------------------------------------------
personas:
  anna:
    email: anna@demo.example.com
    full_name: Анна Байтова
    spec: backend_python
    grade: middle
    theta: 0.4                # скрытый уровень: уверенный Middle («542 · 94%»), тест на 12-м задании
    fsp_sub: 54ac9bcc-d3ac-4244-a71b-656ddbaa7a8f   # призёр всероссийских (демо-реестр ФСП)
    salary_min: 270000
    formats: [hybrid, remote]
    city: Москва
    industries: [fintech]
    experience_months: 54
    declared_skills: [python, fastapi, postgresql, kafka, docker]
    session_answered: 11      # «сессия, начатая утром, на 12-м задании»
    session_pending_p_low: 0.70   # после 11-го ответа P(пройдёт) лежит в этом окне: два верных ответа → стоп «пройдено»
    session_pending_p_high: 0.89
    session_theta_search_seeds: 25
  ilya:
    email: ilya@demo.example.com
    full_name: Илья Стеков
    spec: backend_python
    grade: middle
    theta: 0.8
    salary_min: 230000
    formats: [hybrid, remote]
    city: Москва
    industries: [fintech, ecommerce]
    experience_months: 40
    declared_skills: [python, django, postgresql, docker]
    # «Не хватает подтверждённого SQL»: модуль sql занижен, тег «заявлено» без подтверждения
    weak_modules: { sql: -1.8 }     # модуль SQL заметно ниже общего уровня
    ensure_unconfirmed_skill: sql
    unconfirmed_theta_max: -0.1     # оценка уровня по SQL не выше (Middle = 0): навык «не подтверждён» для брифа Middle
    # Оценка SQL по 4–6 заданиям шумная: нужный исход («Middle подтверждён, SQL ≤ порога») даёт лишь ~1/3 попыток.
    # Поэтому попыток много, а после escalate_after неудач «истинный» уровень SQL занижается ещё на escalate_step
    # за попытку — к концу перебора исход гарантирован (сид детерминирован: seed попытки = "ilya:<номер>")
    session_tries: 40
    escalate_after: 8
    escalate_step: 0.15
  maria_contact:             # контакты и профиль, которые Мария подтвердит сама при регистрации
    full_name: Мария Лямбдина

staged:                      # ступенчатые аккаунты кандидата (G2, RK2): где «застрять» нельзя
  - { key: registered, email: stage1-registered@demo.example.com, full_name: Пётр Регистров, stage: registered,
      title: "Только зарегистрирован: впереди опрос" }
  - { key: survey,     email: stage2-survey@demo.example.com,     full_name: Ольга Опросова,  stage: survey,
      title: "Опрос пройден: впереди выбор грейда и тест" }
  - { key: midtest,    email: stage3-midtest@demo.example.com,    full_name: Глеб Середин,    stage: midtest, answered: 7,
      title: "Середина теста: 7 заданий позади" }
  - { key: category,   email: stage4-category@demo.example.com,   full_name: Вера Категориева, stage: category, theta: 0.7, grade: middle,
      title: "С категорией: Backend · Middle подтверждён" }
staged_defaults:
  spec: backend_python
  claimed_grade: middle
  keep_alive: [midtest]      # сессия «на середине» не должна оборваться за 30 минут — её освежает демо-цикл

