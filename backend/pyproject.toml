[project]
name = "vzaimno-backend"
version = "0.1.0"
description = "«Взаимно» — платформа обратного подбора ИТ-специалистов с верифицированным профилем ФСП"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pyahocorasick>=2.1",
    "pdfplumber>=0.11",
    "pdfminer.six>=20231228",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "reportlab>=5.0.1",
    "qrcode[pil]>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "scipy>=1.13",  # только tests/test_matching_scoring.py (контрольные значения нормального распределения)
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# Статическая типизация (docs/ENGINEERING.md). `uv run mypy` — весь app по умолчанию: числом ошибок отслеживаем долг,
# `make typecheck` — блокирующий строгий прогон ядер (список файлов в [tool.vzaimno.typecheck_strict] и Makefile/CI).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["app"]
warn_unused_configs = true
no_implicit_optional = true

[tool.vzaimno.typecheck_strict]
# Строгий режим (mypy --strict) обязателен на этих файлах: IRT/CAT-движок, скоринг и подборка, ядро безопасности и ФСП VSS
files = [
    "app/testing/irt.py",
    "app/testing/cat.py",
    "app/testing/calibration.py",
    "app/testing/detectors.py",
    "app/testing/session.py",
    "app/testing/simulate.py",
    "app/testing/survey.py",
    "app/matching/scoring.py",
    "app/matching/explain.py",
    "app/matching/selection.py",
    "app/matching/market.py",
    "app/fsp/vss.py",
    "app/fsp/models.py",
    "app/fsp/schema.py",
    "app/fsp/config.py",
    "app/core/security.py",
    "app/core/rate_limit.py",
    "app/core/access.py",
    "app/core/audit.py",
    "app/core/clock.py",
    "app/core/configs.py",
    "app/core/consents.py",
    "app/core/domains.py",
    "app/core/errors.py",
    "app/core/netutil.py",
]
