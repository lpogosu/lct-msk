[project]
name = "vzaimno-backend"
version = "0.1.0"
description = "«Взаимно» — платформа обратного подбора ИТ-специалистов с верифицированным профилем ФСП"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pyahocorasick>=2.1",
    "pdfplumber>=0.11",
    "pdfminer.six>=20231228",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "reportlab>=5.0.1",
    "qrcode[pil]>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "scipy>=1.13",  # только tests/test_matching_scoring.py (контрольные значения нормального распределения)
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
