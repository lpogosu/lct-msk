<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" font-family="Segoe UI, Arial, sans-serif" aria-label="Калибровка сложности: ошибка по числу ответов"><style>svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;}@media (prefers-color-scheme: dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;}}}}text{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;fill:var(--ink2);font-size:12px}.t{fill:var(--ink);font-size:14px;font-weight:600}.ax{stroke:var(--axis);stroke-width:1}.g{stroke:var(--grid);stroke-width:1}.thr{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}.tick{font-variant-numeric:tabular-nums}</style><title>Калибровка сложности: ошибка по числу ответов</title><desc>RMSE сложности: 0,48, 0,29, 0,2, 0,13</desc><rect width="720" height="340" rx="8" fill="var(--bg)"/><text class="t" x="64" y="24">Калибровка сложности: ошибка по числу ответов</text><line class="g" x1="64" y1="292.0" x2="696" y2="292.0"/><text class="tick" x="56" y="296.0" text-anchor="end">0</text><line class="g" x1="64" y1="235.0" x2="696" y2="235.0"/><text class="tick" x="56" y="239.0" text-anchor="end">0,2</text><line class="g" x1="64" y1="178.0" x2="696" y2="178.0"/><text class="tick" x="56" y="182.0" text-anchor="end">0,4</text><line class="g" x1="64" y1="121.0" x2="696" y2="121.0"/><text class="tick" x="56" y="125.0" text-anchor="end">0,6</text><line class="g" x1="64" y1="64.0" x2="696" y2="64.0"/><text class="tick" x="56" y="68.0" text-anchor="end">0,8</text><text x="14" y="178" transform="rotate(-90 14 178)" text-anchor="middle">RMSE</text><line class="ax" x1="64" y1="292" x2="696" y2="292"/><text x="143.0" y="310" text-anchor="middle">0</text><text x="301.0" y="310" text-anchor="middle">30</text><text x="459.0" y="310" text-anchor="middle">100</text><text x="617.0" y="310" text-anchor="middle">300</text><text x="380" y="332" text-anchor="middle">ответов на семейство (0 — только экспертная оценка)</text><line class="thr" x1="64" y1="206.5" x2="696" y2="206.5"/><text x="696" y="200.5" text-anchor="end">цель ≤ 0,30 после 100</text><path d="M143.0,156.0 L301.0,209.2 L459.0,236.1 L617.0,255.5" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/><circle cx="143.0" cy="156.0" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="301.0" cy="209.2" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="459.0" cy="236.1" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/><circle cx="617.0" cy="255.5" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/></svg>
